      - generic [ref=e140]:
        - article [ref=e141]:
          - text: 01 · Model
          - heading "Define the physics" [level=3] [ref=e142]
          - paragraph [ref=e143]: Gravity, launch height, Fuel radius, Hub geometry, hood calibration, and flywheel-to-exit-speed mapping establish the search space.
        - article [ref=e144]:
          - text: 02 · Search
          - heading "Sweep the launch space" [level=3] [ref=e145]
          - paragraph [ref=e146]: Sample distance and radial velocity. At each state, sweep hood position and exit speed, then evaluate the resulting ballistic flight.
        - article [ref=e147]:
          - text: 03 · Select
          - heading "Choose useful trajectories" [level=3] [ref=e148]
          - paragraph [ref=e149]: Opening intersection, lip clearance, and descending entry angle establish feasibility. Margin, speed headroom, flight time, and hood travel shape candidate ranking.
        - article [ref=e150]:
          - text: 04 · Compress
          - heading "Fit and generate" [level=3] [ref=e151]
          - paragraph [ref=e152]: Least-squares fitting produces two quadratic surfaces. One generator writes matching Java and TypeScript coefficients and records maximum fit residuals.
