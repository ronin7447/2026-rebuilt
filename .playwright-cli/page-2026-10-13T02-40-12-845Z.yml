          - paragraph [ref=e135]:
            - text: Behind every moving shot is our physics-based
            - strong [ref=e136]: ShotMap
            - text: . We do the expensive trajectory search ahead of time, fit the results into compact polynomials, and evaluate those equations on the robot.
      - generic [ref=e137]:
        - text: Our runtime launch model
        - generic [ref=e138]: f(d, vᵣ) = c₀ + c₁d + c₂vᵣ + c₃d² + c₄dvᵣ + c₅vᵣ²
